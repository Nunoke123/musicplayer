<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-tab="playlist">
    <section id="albums">
        <h2>Albums</h2>
        <a href="#" onclick="showAlbum('UNDERTALE')"><img src="covers/undertale.webp" alt="Undertale"></a>
        <a href="#" onclick="showAlbum('Deltarune')"><img src="covers/deltarune.webp" alt="Deltarune"></a>
        <a href="#" onclick="showAlbum('Homestuck')"><img src="covers/homestuck.webp" alt="Homestuck"></a>
    </section>

    <main>
        <h1 id="title"></h1>
        <span id="artist"></span>
        <img src="" alt="Cover" id="cover">
        <div id="progressRow">
            <span id="currentTime">0:00</span>
            <input type="range" id="progress" min="0" max="100" step="any" value="0" aria-label="Song progress">
            <span id="duration">0:00</span>
        </div>
        <div>
            <button id="backBtn">⬅️</button>
            <button id="pauseBtn">▶️</button>
            <button id="nextBtn">➡️</button>
        </div>
        <button id="clearBtn">🗑️ Clear playlist</button>
        <ul id="playlist"></ul>
    </main>

    <section id="search">
        <h2>Search</h2>
        <input type="search" id="searchInput" placeholder="Search songs">
        <ul id="searchResults"></ul>
    </section>

    <nav id="tabs">
        <button data-tab="albums" onclick="document.body.dataset.tab = this.dataset.tab">💿 Albums</button>
        <button data-tab="playlist" onclick="document.body.dataset.tab = this.dataset.tab">🎵 Playlist</button>
        <button data-tab="search" onclick="document.body.dataset.tab = this.dataset.tab">🔍 Search</button>
    </nav>

    <audio src="" id="player"></audio>
    <script src="script.js"></script>
</body>
</html>
