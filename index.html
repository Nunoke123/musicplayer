<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="player">
        <img id="songImage" src="">
        <h1 id="songTitle"></h1>
        <p id="songArtist"></p>
        <div class="buttons">
            <button id="loopBtn">🔁</button>
            <button id="shuffleBtn">🔀</button>
            <button id="prevBtn">⬅️</button>
            <button id="playToggle">▶️</button>
            <button id="nextBtn">➡️</button>
            <button id="downloadBtn">⬇️</button>
            <button id="importBtn">⬆️</button>
            <input type="file" id="fileInput" accept="audio/*" style="display:none">
        </div>
        <div class="progress">
            <p id="currentTime">0:00</p>
            <input type="range" id="progress" value="0">
            <p id="totalTime">0:00</p>
        </div>
    </section>
    <section class="playlist">
        <ul id="playlist"></ul>
    </section>
    <audio id="player" src=""></audio>
    <script src="script.js"></script>
</body>

</html>
